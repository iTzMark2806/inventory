<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <!-- Logo: images/velmora.png -->
      <div class="brand">
        <img src="velmora.png" alt="Velmora" />
      </div>

      <button class="menu-btn" id="menuBtn" type="button" aria-label="Toggle menu">
        <span class="material-icons">menu</span>
      </button>

      <label class="search">
        <span class="material-icons">search</span>
        <input id="globalSearch" type="search" placeholder="What are you looking for?" />
      </label>

      <div class="top-right">
        <button class="bell" id="bell" type="button" aria-label="Low stock alerts">
          <span class="material-icons">notifications_none</span>
          <span class="count" id="bellCount" hidden>0</span>
        </button>

        <div class="user-card">
          <div class="avatar" id="avatar">JD</div>
          <div class="who">
            <div class="name" id="userName">Juan Dela Cruz</div>
            <div class="role" id="userRole">Inventory Checker</div>
          </div>
        </div>
      </div>
    </header>

    <nav class="sidebar" id="sidebar" aria-label="Main navigation"></nav>

    <main class="main" id="main"></main>

    <dialog id="formDialog"></dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
